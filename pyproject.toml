[project]
name = "chess-course-to-pgn"
version = "0.1.0"
description = "Scrape chess.com courses you own into PGN files"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "playwright>=1.48",
    "chess>=1.11",
    "typer>=0.13",
]

[project.scripts]
chess-course-to-pgn = "chess_course_to_pgn.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chess_course_to_pgn"]
