[project]
name = "pgn-dl"
version = "0.1.0"
description = "Download PGN from chess.com, and other sources over time"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "chess>=1.11",
    "httpx>=0.27",
    "typer>=0.13",
]

[project.optional-dependencies]
browser = ["playwright>=1.48"]

[project.scripts]
pgn-dl = "pgn_dl.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pgn_dl"]
